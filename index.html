<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
    <meta name="description" content="MagicY8 — cinematic AI video prompt generator powered by Gemini. Create production-ready prompts for Veo, Sora, Runway, and Kling." />
    <meta property="og:title" content="MagicY8 — AI Prompt Studio" />
    <meta property="og:description" content="Generate production-ready cinematic and tattoo video prompts, powered by Gemini." />
    <meta property="og:type" content="website" />
    <title data-default>MagicY8 — AI Video Prompt Studio</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        width: 100%;
        min-width: 0;
        min-height: 100%;
        margin: 0;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        background: #030712;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
        max-width: 100%;
      }

      p,
      span,
      button,
      label,
      div {
        min-width: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
