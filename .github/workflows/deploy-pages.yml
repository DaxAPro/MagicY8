name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyA7HnNh6cjDkn76Jks_a4-59-cqTRAutH8
          VITE_FIREBASE_AUTH_DOMAIN: magicy8-ai.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: magicy8-ai
          VITE_FIREBASE_STORAGE_BUCKET: magicy8-ai.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1004992199689"
          VITE_FIREBASE_APP_ID: "1:1004992199689:web:46e9aa031c64ea33c4ccd8"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
